# Render blueprint (not yet deployed or verified on Render).
services:
  - type: web
    name: kavach
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && alembic upgrade head && uvicorn app.serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CC_ENV
        value: production
      - key: CC_COOKIE_SECURE
        value: "true"
      - key: CC_CORS_ORIGINS
        value: ""
      - key: CC_DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString

  - type: cron
    name: kavach-watchman
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.watchman.cron
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CC_DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString

databases:
  - name: kavach-db
    plan: free
