# Render Blueprint (free plans only): the dashboard and API on one web service, and a Postgres database.
# Deploy: Render dashboard > New > Blueprint > pick this repository.
#
# Watchman runs inside the web service every 6 hours while it is awake (free services sleep after 15 idle
# minutes). For checks that run on schedule regardless, add a payment card and the two paid services in
# README "Scaling Watchman": a cron job and the kavach-watchman-flow Render Workflow (app/watchman/workflow.py).
services:
  - type: web
    name: kavach
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && alembic upgrade head && uvicorn app.serve:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: NODE_VERSION
        value: 22.12.0
      - key: CC_ENV
        value: production
      - key: CC_COOKIE_SECURE
        value: "true"
      - key: CC_CORS_ORIGINS
        value: ""
      - key: CC_WATCH_SCHEDULER_ENABLED
        value: "true"
      - key: CC_FETCH_RENDER_ENABLED
        value: "false"
      - key: CC_DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString

databases:
  - name: kavach-db
    plan: free
    region: singapore
    databaseName: kavach
    ipAllowList: []  # reachable only from Render services in this workspace
